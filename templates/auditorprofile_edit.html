
{% extends 'base.html' %} 
 {% block body_block %}
 {% load static %}

<div class="content-wrapper">
   
    {% if not view %}
    <button type="submit" form="myForm" class="btn btn-success">Save</button>
    {% endif %}
    <a href="javascript:window.history.back()" class="btn btn-danger">Cancel</a>

    <div class="col-12 grid-margin stretch-card">
        <div class="container mt-5 col-md-6">
            <div class="card card-body">
                <h2>Auditor Profile</h2>
                    <form  method="post" enctype="multipart/form-data" id="myForm">
                    {% csrf_token %}
                    <label>User</label>
                    <select name="user" class="form-control">
                        <option value="">--SELECT--</option>
                        {% for user in user_list %}
                            <option value="{{ user.id }}" {% if user.id|stringformat:"s" == user_id|stringformat:"s" %} selected {% endif %}>
                                {{ user.first_name }} ({{user.roles.name}})
                            </option>
                        {% endfor %}
                    </select>
                    {% for form_field in form %}
                    <div class="form-group">
                        {{ form_field.label_tag }}
                        {{ form_field }}
                        <span class="text-danger">{{form_field.errors}}</span>
                    </div>
                    {% endfor %}
                </form>
            </div>
        </div>
    </div>

</div>
{% if view %}
<script>
    // Select the form by ID
    var form = document.getElementById('myForm');
    
    // Loop through all form elements
    for (var i = 0; i < form.elements.length; i++) {
        form.elements[i].disabled = true;
    }
</script>
{% endif %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


{% endblock %}
